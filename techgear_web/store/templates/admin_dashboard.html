{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-3">Panel Admin: Registrar Producto</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Guardar Producto en API</button>
        </form>
    </div>
</div>
{% endblock %}
